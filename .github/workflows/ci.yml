name: Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Test Suite & Quality Checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tripweaver_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Astral UV
        uses: astral-sh/setup-uv@v2

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Syntax Compilation Check
        run: |
          python -m py_compile app.py backend.py mcp_client.py custom_weather_mcp.py

      - name: Run Pytest Test Suite
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tripweaver_test
          GROQ_API_KEY: fake_test_key
          TAVILY_API_KEY: fake_test_key
          AVIATIONSTACK_API_KEY: fake_test_key
          OPENWEATHER_API_KEY: fake_test_key
        run: |
          pytest tests/test_backend_units.py tests/test_weather_and_utils.py tests/test_api.py tests/test_enterprise.py -v

  docker-build:
    name: Verify Production Docker Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: tripweaver-ai:latest
